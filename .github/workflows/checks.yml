name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src integrations scripts tests baselines
      - run: ruff format --check src integrations scripts tests baselines
      - run: python -m pytest tests
