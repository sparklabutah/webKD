[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webkd"
version = "0.1.0"
description = "Student-aligned text distillation for web agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6"]

[project.optional-dependencies]
teacher = ["openai>=1.0", "anthropic>=0.40"]
scoring = ["transformers>=5.0,<6"]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
webkd = "webkd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
