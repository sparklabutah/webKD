name = "webkd_lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["WebkdLean"]

[leanOptions]
autoImplicit = false # a typo must be an error, not a new universally quantified variable
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "WebkdLean"
